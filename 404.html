<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — ONLY BMW Service</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161819">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<style>
  :root { --ink:#161819; --text:#E4E5DF; --muted:#A3ADB0; --blue:#345198; --focus:#B4C7EE; }
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ink); color:var(--text);
         font:350 1.0625rem/1.6 'Geologica', system-ui, sans-serif; padding:1rem; }
  main { max-width: 34rem; }
  .code { font:700 clamp(4rem,14vw,7rem)/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing:-.04em; margin:0; }
  h1 { font-size: clamp(1.5rem,4vw,2rem); line-height:1.15; margin:.75rem 0 .5rem; }
  p { color: var(--muted); margin:0 0 1.5rem; }
  a.btn { display:inline-flex; align-items:center; min-height:48px; padding:.75rem 1.35rem; border-radius:6px;
          background:var(--blue); color:#fff; text-decoration:none; font-weight:600; margin-right:.5rem; margin-bottom:.5rem; }
  a.plain { color: var(--text); }
  :focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет.</h1>
  <p>Чек горит, но не у вас. Вернитесь на главную или позвоните, запишем.</p>
  <a class="btn" href="/">На главную</a>
  <a class="plain" href="tel:+79533451555">+7 953 345-15-55</a>
</main>
</body>
</html>
